[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "palmmind-rag"
version = "1.0.0"
description = "Two-API document ingestion and conversational RAG backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3", "sqlalchemy>=2.0,<3",
  "redis>=5.2,<7", "qdrant-client>=1.13,<2", "openai>=1.68,<3", "pypdf>=5.3,<7"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "fakeredis[lua]>=2.27,<3", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = true
files = ["app"]
